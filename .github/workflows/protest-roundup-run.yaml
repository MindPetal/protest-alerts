# Install Python dependencies, run the weekly open-protest roundup.

name: Protest-Roundup-Run

on:
  workflow_dispatch:
  schedule:
    # 3:00pm EDT (19:00 UTC) on Fridays
    - cron: '0 19 * * 5'

permissions:
  contents: read

jobs:
  protest-roundup-run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
    - name: Set up Python
      run: uv python install 3.13
    - name: Install dependencies
      run: uv sync --locked
    - name: Install Playwright browsers
      run: uv run playwright install chromium
    - name: Run roundup
      env:
        RFQ_LIST: ${{ secrets.RFQ_LIST }}
        MS_URL: ${{ secrets.MS_URL }}
      run: uv run python3 search.py "$RFQ_LIST" "$MS_URL" roundup
