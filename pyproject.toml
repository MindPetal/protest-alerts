[project]
name = "protest-alerts"
version = "1.0.1"
description = "GAO protest search and post to a chat channel (MS Teams)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.10.18",
    "playwright>=1.51.0",
    "python-dateutil>=2.5.3",
    "six>=1.10",
    "urllib3>=2.8.0",
]

[project.scripts]
protest-alerts = "protest_alerts.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protest_alerts", "src/client"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]
exclude = ["src/client/", "build/"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["client", "protest_alerts"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["src/client/", "build/"]

[tool.ty.rules]
invalid-argument-type = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
