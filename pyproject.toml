[project]
name = "protest-alerts"
version = "1.0.0"
description = "GAO protest search and post to MS Teams"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.5.20",
    "playwright>=1.60.0",
    "python-dateutil>=2.5.3",
    "setuptools>=21.0.0",
    "six>=1.10",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["client/", "build/"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["client", "search"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["client/", "build/"]

[tool.ty.rules]
invalid-argument-type = "warn"
