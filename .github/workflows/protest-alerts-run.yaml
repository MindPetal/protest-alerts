# Install Python dependencies, run the search.

name: protest-alerts-run

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days back to search"
        required: false
        default: "1"
  #schedule:
    #- cron: '24 04 * * *'
      #timezone: "America/New_York"

permissions:
  contents: read

jobs:
  protest-alerts-run:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
    - name: Set up Python
      run: uv python install 3.13
    - name: Install dependencies
      run: uv sync --locked
    - name: Install Playwright browsers
      run: uv run playwright install chromium
    - name: Run search
      env:
        RFQ_LIST: ${{ secrets.RFQ_LIST }}
        MS_URL: ${{ secrets.MS_URL }}
        SLACK_URL: ${{ secrets.SLACK_URL }}
        DAYS: ${{ github.event.inputs.days || '1' }}
      run: uv run protest-alerts daily
